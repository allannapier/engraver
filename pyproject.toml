[project]
name = "engraver"
version = "0.1.0"
description = "Local browser app for designing and running jobs on a GRBL diode laser (Atomstack A10)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyserial>=3.5",
    "pydantic>=2.7",
    "pillow>=10.0",
    "numpy>=1.26",
    # 1.82.7 and 1.82.8 were malicious uploads (March 2026); stay above them.
    "litellm>=1.83.0",
]

[project.scripts]
engraver = "engraver.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engraver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
