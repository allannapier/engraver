[project]
name = "engraver"
version = "0.1.0"
description = "Local browser app for designing and running jobs on a GRBL diode laser (Atomstack A10)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Allan Napier" }]
keywords = ["laser", "engraver", "grbl", "gcode", "atomstack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyserial>=3.5",
    "pydantic>=2.7",
    "pillow>=10.0",
    "numpy>=1.26",
    # 1.82.7 and 1.82.8 were malicious uploads (March 2026); stay above them.
    "litellm>=1.83.0",
]

[project.scripts]
engraver = "engraver.cli:main"

[project.urls]
Homepage = "https://github.com/allannapier/engraver"
Issues = "https://github.com/allannapier/engraver/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-github-actions-annotate-failures>=0.3",  # failing tests show up inline on the pull request
    "httpx>=0.27",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engraver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # import order
    "UP",           # syntax newer Pythons make simpler
    "B",            # likely bugs
    "C4", "PIE", "SIM", "RUF",
    "ASYNC",
    "PLE",
]
ignore = [
    "E501",    # line length is the formatter's job; long strings are left alone
    "SIM105",  # try/except/pass is kept where it reads clearer than contextlib.suppress
    "SIM108",  # ternaries are not always clearer
    "RUF001",  # "×" in user-facing text is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]  # polling loops in tests are fine

[tool.coverage.run]
source = ["engraver"]
branch = true

[tool.coverage.report]
omit = ["*/engraver/cli.py"]  # starts uvicorn and opens a browser
fail_under = 85
show_missing = true
skip_covered = true
