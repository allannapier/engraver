<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engraver</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23262b33'/%3E%3Cpath d='M16 5v13' stroke='%235b8cff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='23' r='3.5' fill='%23ff8a1f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Engraver</div>
    <div class="connection">
      <label class="sr-only" for="port">Port</label>
      <select id="port" title="Where the laser is plugged in"></select>
      <button id="port-refresh" class="icon-btn" title="Look for ports again" aria-label="Look for ports again"></button>
      <button id="connect" class="btn">Connect</button>
    </div>
    <div class="machine-state" id="machine-state" data-state="Disconnected">
      <span class="dot" aria-hidden="true"></span><span id="state-text">Not connected</span>
    </div>
    <dl class="dro" aria-label="Head position in millimetres">
      <div><dt>X</dt><dd id="dro-x">–</dd></div>
      <div><dt>Y</dt><dd id="dro-y">–</dd></div>
    </dl>
    <div class="file-actions">
      <button id="project-open" class="btn ghost">Open</button>
      <button id="project-save" class="btn ghost">Save</button>
      <button id="export-gcode" class="btn ghost" title="Save the job as a G-code file">Export G-code</button>
      <button id="report-bug" class="btn ghost" title="Send a bug report with diagnostics to the project's issue tracker">Report a bug</button>
    </div>
  </header>

  <main class="workspace">
    <nav class="tools" aria-label="Canvas tools">
      <button data-tool="import" title="Import SVG or image"></button>
      <button data-tool="text" title="Add text"></button>
      <button data-tool="rect" title="Add rectangle"></button>
      <button data-tool="ellipse" title="Add ellipse"></button>
      <hr>
      <button data-tool="undo" title="Undo (Ctrl+Z)"></button>
      <button data-tool="redo" title="Redo (Ctrl+Shift+Z)"></button>
      <button data-tool="duplicate" title="Duplicate (Ctrl+D)"></button>
      <button data-tool="delete" title="Delete (Del)"></button>
      <hr>
      <button data-tool="center" title="Centre on the bed"></button>
      <button data-tool="zoom-in" title="Zoom in"></button>
      <button data-tool="zoom-out" title="Zoom out"></button>
      <button data-tool="fit" title="Show the whole bed"></button>
    </nav>

    <section class="stage-wrap">
      <div class="propbar">
        <div class="prop-fields" id="prop-fields" hidden>
          <label>X <input id="prop-x" type="number" step="0.1"></label>
          <label>Y <input id="prop-y" type="number" step="0.1"></label>
          <label>W <input id="prop-w" type="number" step="0.1" min="0.1"></label>
          <button id="prop-lock" class="icon-btn" aria-pressed="true" title="Keep proportions" aria-label="Keep proportions"></button>
          <label>H <input id="prop-h" type="number" step="0.1" min="0.1"></label>
          <label>Angle <input id="prop-rot" type="number" step="1"></label>
          <label>Layer <select id="prop-layer"></select></label>
          <button id="prop-edit-text" class="btn" hidden>Edit text</button>
          <span class="prop-unit">mm from the front-left corner</span>
        </div>
        <span class="stage-hint" id="stage-hint"></span>
      </div>
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="Laser bed canvas"></svg>
      <div class="dropzone" id="dropzone" hidden>Drop to add to the bed</div>
    </section>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="design" aria-selected="true">Design</button>
        <button role="tab" data-tab="laser" aria-selected="false">Laser</button>
        <button role="tab" data-tab="assistant" aria-selected="false">Assistant</button>
        <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
      </div>
      <div class="panel" id="tab-design" role="tabpanel"></div>
      <div class="panel" id="tab-laser" role="tabpanel" hidden></div>
      <div class="panel" id="tab-assistant" role="tabpanel" hidden></div>
      <div class="panel" id="tab-setup" role="tabpanel" hidden></div>
    </aside>
  </main>

  <footer class="jobbar">
    <div class="job-buttons">
      <button id="job-frame" class="btn" title="Trace the outline of the job with the laser off">Frame</button>
      <button id="job-start" class="btn primary">Start</button>
      <button id="job-pause" class="btn" disabled>Pause</button>
      <button id="job-stop" class="btn stop" disabled>Stop</button>
    </div>
    <div class="job-progress">
      <div class="job-line"><span id="job-title">No job running</span><span id="job-time"></span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="job-bar"><i></i></div>
    </div>
    <div class="job-summary" id="job-summary"></div>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <input type="file" id="file-import" accept=".svg,image/svg+xml,image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  <input type="file" id="file-project" accept=".json,application/json" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
